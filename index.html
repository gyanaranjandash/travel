<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travels — Gyana Ranjan Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: hidden; }
    #globe-canvas { position: fixed; inset: 0; z-index: 0; cursor: grab; }
    #globe-canvas:active { cursor: grabbing; }

    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.6rem 3rem;
      background: linear-gradient(to bottom, rgba(5,6,10,0.92) 0%, transparent 100%);
    }
    .site-header .wordmark {
      font-family: 'Cormorant Garamond', serif; font-size: 1.05rem;
      font-weight: 300; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    }
    .site-header .wordmark span { color: var(--accent); }
    .site-header nav { display: flex; align-items: center; }
    .site-header nav a {
      font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 300;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      text-decoration: none; margin-left: 1.8rem; transition: color 0.3s;
    }
    .site-header nav a:hover { color: var(--fg); }
    .site-header nav a.profile-btn {
      color: var(--accent); border: 1px solid rgba(79,156,249,0.35);
      padding: 0.4rem 1rem; border-radius: 20px;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .site-header nav a.profile-btn:hover {
      background: rgba(79,156,249,0.1); color: var(--fg); border-color: var(--accent);
    }

    .hero-text {
      position: fixed; top: 50%; left: 3rem; transform: translateY(-50%);
      z-index: 10; pointer-events: none;
    }
    .hero-text .eyebrow {
      font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 300;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 0.8rem; opacity: 0; animation: fadeUp 1s 0.4s forwards;
    }
    .hero-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 5vw, 4.8rem); font-weight: 300;
      line-height: 1.06; color: var(--fg); margin: 0;
      opacity: 0; animation: fadeUp 1s 0.6s forwards;
    }
    .hero-text h1 em { font-style: italic; color: var(--accent); }
    .hero-text .sub {
      font-family: 'DM Sans', sans-serif; font-size: 0.77rem; font-weight: 300;
      letter-spacing: 0.08em; color: var(--muted); margin-top: 1rem;
      opacity: 0; animation: fadeUp 1s 0.8s forwards;
    }

    #tooltip {
      position: fixed; z-index: 30; pointer-events: none;
      background: rgba(10,12,20,0.93); border: 1px solid rgba(100,160,255,0.25);
      border-radius: 4px; padding: 0.5rem 0.9rem;
      display: none; flex-direction: column; gap: 2px;
      backdrop-filter: blur(12px); transform: translate(-50%, -130%);
    }
    #tooltip.show { display: flex; }
    #tooltip .tip-name {
      font-family: 'Cormorant Garamond', serif; font-size: 1rem;
      font-weight: 400; color: var(--fg);
    }
    #tooltip .tip-hint {
      font-family: 'DM Sans', sans-serif; font-size: 0.6rem; font-weight: 300;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
    }

    .globe-footer {
      position: fixed; bottom: 2rem; right: 3rem; z-index: 20;
      text-align: right; opacity: 0; animation: fadeUp 1s 1.2s forwards;
    }
    .globe-footer .count {
      font-family: 'Cormorant Garamond', serif; font-size: 2.8rem;
      font-weight: 300; color: var(--fg); line-height: 1;
    }
    .globe-footer .count span { color: var(--accent); }
    .globe-footer .label {
      font-family: 'DM Sans', sans-serif; font-size: 0.63rem; font-weight: 300;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    }

    .zoom-controls {
      position: fixed; bottom: 8.5rem; right: 3rem; z-index: 20;
      display: flex; flex-direction: column; gap: 0.5rem;
      opacity: 0; animation: fadeUp 1s 1.3s forwards;
    }
    .zoom-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border); background: rgba(8,11,18,0.85);
      color: var(--muted); font-size: 1.15rem; font-weight: 300;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; backdrop-filter: blur(8px);
      transition: border-color 0.3s, color 0.3s, background 0.3s;
      line-height: 1;
    }
    .zoom-btn:hover {
      border-color: var(--accent); color: var(--accent);
      background: rgba(79,156,249,0.08);
    }

    .hint-bar {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      opacity: 0; animation: fadeUp 1s 1.5s forwards;
    }
    .hint-bar span {
      font-family: 'DM Sans', sans-serif; font-size: 0.6rem; font-weight: 300;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    }
    .hint-bar .bar-line {
      width: 1px; height: 24px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      animation: barPulse 2s ease-in-out infinite;
    }
    @keyframes barPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    @media (max-width: 600px) {
      .site-header { padding: 1.2rem 1.4rem; }
      .site-header nav a:not(.profile-btn) { display: none; }
      .hero-text { left: 1.4rem; }
      .globe-footer { display: none; }
      .hint-bar { display: none; }
      .zoom-controls { right: 1rem; bottom: 3.5rem; }
    }
  </style>
</head>
<body>
  <canvas id="globe-canvas"></canvas>

  <header class="site-header">
    <div class="wordmark">Gyana Ranjan <span>Dash</span></div>
    <nav>
      <a href="https://gyanaranjandash.in" class="profile-btn">Go Back to Profile</a>
      <a href="index.html">Travels</a>
    </nav>
  </header>

  <div class="hero-text">
    <div class="eyebrow">Field Notes</div>
    <h1>Every road<br/>taken <em>leaves</em><br/>a mark.</h1>
    <p class="sub">Click a glowing pin to explore.</p>
  </div>

  <div id="tooltip">
    <div class="tip-name" id="tooltip-name"></div>
    <div class="tip-hint">Click to explore →</div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">−</button>
  </div>

  <div class="globe-footer">
    <div class="count"><span>21</span></div>
    <div class="label">Destinations Logged</div>
  </div>

  <div class="hint-bar">
    <span>Drag · Scroll to zoom</span>
    <div class="bar-line"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
